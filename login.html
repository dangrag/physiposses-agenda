<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – PhysioPosses Agenda</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: '#1976D2', sidebar: '#1565C0' } } } }</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .input { width:100%; border:1px solid #D1D5DB; border-radius:8px; padding:.6rem .75rem; font-size:.9rem; background:#fff; outline:none; transition:border-color .15s, box-shadow .15s; }
  .input:focus { border-color:#1976D2; box-shadow:0 0 0 3px rgba(25,118,210,.15); }
  .label { display:block; font-size:.85rem; font-weight:500; color:#374151; margin-bottom:.35rem; }
  .badge { display:inline-block; padding:.15rem .6rem; border-radius:9999px; font-size:.75rem; font-weight:600; }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#1565C0] to-[#1976D2] flex flex-col items-center justify-center p-4 antialiased">
<div class="bg-white w-full max-w-md rounded-xl shadow-2xl p-8">
  <div class="text-center mb-6">
    <div class="mx-auto w-14 h-14 rounded-xl bg-[#1976D2]/10 flex items-center justify-center text-3xl mb-3">➕</div>
    <h1 class="text-xl font-bold text-[#1565C0]">PhysioPosses Agenda</h1>
    <p class="text-sm text-gray-500 mt-1">Sistema de Agendamento</p>
  </div>
  <h2 class="text-lg font-semibold text-gray-800 mb-5">Acesso ao Sistema</h2>
  <form id="login-form" class="space-y-4">
    <div>
      <label class="label" for="email">E-mail</label>
      <div class="relative">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg></span>
        <input id="email" type="email" class="input pl-10" placeholder="secretaria@physioposses.com.br" value="secretaria@physioposses.com.br">
      </div>
    </div>
    <div>
      <label class="label" for="senha">Senha</label>
      <div class="relative">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg></span>
        <input id="senha" type="password" class="input pl-10 pr-10" placeholder="••••••••" value="12345678">
        <button type="button" id="toggle-senha" class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600" aria-label="Mostrar senha">
          <svg id="eye" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="w-full bg-[#1976D2] hover:bg-[#1565C0] text-white font-semibold py-2.5 rounded-lg transition">Entrar</button>
  </form>
  <p class="text-center mt-4"><a href="#" id="esqueceu" class="text-sm text-gray-500 hover:text-[#1976D2]">Esqueceu sua senha?</a></p>
</div>
<p class="text-blue-100 text-xs mt-6">© 2024 PhysioPosses – Sistema de Agendamento</p>
<script>
document.getElementById('login-form').addEventListener('submit', function (e) {
  e.preventDefault();
  window.location.href = './dashboard.html';
});
document.getElementById('toggle-senha').addEventListener('click', function () {
  var s = document.getElementById('senha');
  var show = s.type === 'password';
  s.type = show ? 'text' : 'password';
  this.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
  this.classList.toggle('text-[#1976D2]', show);
});
document.getElementById('esqueceu').addEventListener('click', function (e) {
  e.preventDefault();
  alert('Um link de redefinição de senha será enviado para o e-mail cadastrado.');
});
</script>
</body>
</html>
