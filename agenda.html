<!-- Popover de detalhes -->
<div id="pop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/30 p-4" onclick="if(event.target===this)fecharPop()">

      <button onclick="fecharPop()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none" aria-label="Fechar">&times;</button>

<script>
function toggleSidebar() {
  var s = document.getElementById('sidebar'), o = document.getElementById('overlay');
  var open = s.classList.contains('flex') && s.classList.contains('max-md-open');
  if (open) { s.classList.remove('flex', 'max-md-open'); s.classList.add('hidden'); o.classList.add('hidden'); }
  else { s.classList.remove('hidden'); s.classList.add('flex', 'max-md-open'); o.classList.remove('hidden'); }
}

var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var COR = { 'Confirmado': 'bg-[#4CAF50] text-white', 'Pendente': 'bg-[#FFC107] text-gray-900', 'Cancelado': 'bg-[#9E9E9E] text-white', 'Agendado': 'bg-[#1976D2] text-white' };
var DOT = { 'Confirmado': '#4CAF50', 'Pendente': '#FFC107', 'Cancelado': '#9E9E9E', 'Agendado': '#1976D2' };
// Agendamentos de novembro/2024 (dados fictícios)
var AG = {
  12: [ { label: 'Maria S. 08h', paciente: 'Maria Silva', hora: '08:00', prof: 'Dr. João Ferreira', tipo: 'Fisioterapia Geral', status: 'Agendado' },
        { label: 'Ana O. 10h', paciente: 'Ana Oliveira', hora: '10:00', prof: 'Dr. João Ferreira', tipo: 'Pilates Terapêutico', status: 'Confirmado' } ],
  13: [ { label: 'Carlos S. 09h', paciente: 'Carlos Souza', hora: '09:00', prof: 'Dr. João Ferreira', tipo: 'RPG', status: 'Pendente' } ],
  15: [ { label: 'Pedro L. 11h', paciente: 'Pedro Lima', hora: '11:00', prof: 'Dra. Paula Mendes', tipo: 'Reabilitação', status: 'Agendado' },
        { label: 'Lucia M. 14h', paciente: 'Lucia Martins', hora: '14:00', prof: 'Dra. Paula Mendes', tipo: 'Fisioterapia Geral', status: 'Agendado' } ],
  18: [ { label: 'Marcos T. 17h', paciente: 'Marcos Teixeira', hora: '17:00', prof: 'Dr. João Ferreira', tipo: 'Reabilitação', status: 'Cancelado' } ],
  19: [ { label: 'Fernanda C. 16h', paciente: 'Fernanda Costa', hora: '16:00', prof: 'Dra. Paula Mendes', tipo: 'RPG', status: 'Confirmado' } ],
  20: [ { label: 'Roberto A. 15h', paciente: 'Roberto Alves', hora: '15:00', prof: 'Dr. João Ferreira', tipo: 'Fisioterapia Geral', status: 'Agendado' } ]
};
var ano = 2024, mes = 10; // novembro (0-indexado)

function render() {
  document.getElementById('mes-titulo').textContent = MESES[mes] + ' ' + ano;
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var primeiro = new Date(ano, mes, 1).getDay();
  var total = new Date(ano, mes + 1, 0).getDate();
  var celulas = Math.ceil((primeiro + total) / 7) * 7;
  var temDados = (ano === 2024 && mes === 10);
  for (var i = 0; i < celulas; i++) {
    let dia = i - primeiro + 1;
    var cel = document.createElement('div');
    cel.className = 'min-h-[104px] border-t border-r border-gray-100 p-1.5 ' + ((i % 7 === 0 || i % 7 === 6) ? 'bg-gray-50/60' : '');
    if (dia >= 1 && dia <= total) {
      var hoje = temDados && dia === 12;
      if (hoje) cel.className += ' ring-2 ring-inset ring-[#1976D2] bg-blue-50/40';
      var num = document.createElement('div');
      num.className = 'text-xs font-semibold mb-1 ' + (hoje ? 'inline-flex w-6 h-6 items-center justify-center rounded-full bg-[#1976D2] text-white' : 'text-gray-600 px-1');
      num.textContent = dia;
      cel.appendChild(num);
      var lista = temDados ? (AG[dia] || []) : [];
      lista.forEach(function (a) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'block w-full text-left truncate text-[11px] font-medium rounded px-1.5 py-0.5 mb-1 hover:opacity-85 ' + COR[a.status];
        b.textContent = a.label;
        b.addEventListener('click', function () { abrirPop(a, dia); });
        cel.appendChild(b);
      });
    }
    grid.appendChild(cel);
  }
}

function abrirPop(a, dia) {
  var linhas = [['Paciente', a.paciente], ['Data', ('0' + dia).slice(-2) + '/11/2024'], ['Horário', a.hora], ['Profissional', a.prof], ['Tipo', a.tipo]];
  var html = linhas.map(function (l) { return '<div class="flex justify-between gap-4"><dt class="text-gray-500">' + l[0] + '</dt><dd class="font-medium text-gray-800 text-right">' + l[1] + '</dd></div>'; }).join('');
  html += '<div class="flex justify-between gap-4"><dt class="text-gray-500">Status</dt><dd><span class="badge ' + COR[a.status] + '">' + a.status + '</span></dd></div>';
  document.getElementById('pop-body').innerHTML = html;
  var p = document.getElementById('pop'); p.classList.remove('hidden'); p.classList.add('flex');
}
function fecharPop() { var p = document.getElementById('pop'); p.classList.add('hidden'); p.classList.remove('flex'); }

document.getElementById('prev').addEventListener('click', function () { mes--; if (mes < 0) { mes = 11; ano--; } render(); });
document.getElementById('next').addEventListener('click', function () { mes++; if (mes > 11) { mes = 0; ano++; } render(); });
document.querySelectorAll('#view-btns button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    if (btn.dataset.view !== 'Mês') { alert('Visualização por ' + btn.dataset.view + ' disponível na versão final do sistema.'); }
  });
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharPop(); });
render();
</script>
