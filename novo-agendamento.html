<h1 class="text-2xl font-bold text-gray-800 mb-6">Novo Agendamento</h1>
<form id="form-ag" class="bg-white rounded-xl shadow-sm p-6 max-w-3xl">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div class="md:col-span-2">
      <label class="label" for="paciente">Paciente *</label>
      <input id="paciente" list="lista-pacientes" class="input" placeholder="Digite o nome do paciente..." required>
      <datalist id="lista-pacientes"><option value="Maria Silva"><option value="Carlos Souza"><option value="Ana Oliveira"><option value="Pedro Lima"><option value="Lucia Martins"><option value="Roberto Alves"><option value="Fernanda Costa"><option value="Marcos Teixeira"></datalist>
    </div>
    <div><label class="label" for="data">Data *</label><input id="data" type="date" class="input" value="2024-11-13" required></div>
    <div><label class="label" for="horario">Horário *</label><select id="horario" class="input" required><option value="" disabled selected>Selecione o horário</option><option>08:00</option><option>09:00</option><option>10:00</option><option>11:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option></select></div>
    <div><label class="label" for="prof">Profissional *</label><select id="prof" class="input" required><option value="" disabled selected>Selecione o profissional</option><option>Dr. João Ferreira</option><option>Dra. Paula Mendes</option></select></div>
    <div><label class="label" for="tipo">Tipo de Atendimento *</label><select id="tipo" class="input" required><option value="" disabled selected>Selecione o tipo</option><option>Fisioterapia Geral</option><option>RPG</option><option>Pilates Terapêutico</option><option>Reabilitação</option></select></div>
    <div class="md:col-span-2"><label class="label" for="obs">Observações</label><textarea id="obs" rows="3" class="input" placeholder="Informações adicionais sobre o atendimento..."></textarea></div>
    <label class="md:col-span-2 flex items-center gap-3 bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-gray-700 cursor-pointer">
      <input type="checkbox" checked class="w-4 h-4 accent-[#1976D2]">
      <span>✓ Enviar lembrete automático por e-mail 24h antes</span>
    </label>
  </div>
  <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 mt-6 pt-5 border-t border-gray-100">
    <a href="./agenda.html" class="text-center px-5 py-2.5 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium transition">Cancelar</a>
    <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#1976D2] hover:bg-[#1565C0] text-white font-semibold transition">Salvar Agendamento</button>
  </div>
</form>

</main>

<div id="modal" class="fixed inset-0 bg-black/40 z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center">
    <div class="mx-auto w-14 h-14 rounded-full bg-green-100 text-[#4CAF50] flex items-center justify-center text-3xl mb-3">✓</div>
    <h3 id="modal-title" class="text-lg font-semibold text-gray-800 mb-1">Sucesso</h3>
    <p id="modal-text" class="text-sm text-gray-600 mb-5"></p>
    <button id="modal-ok" class="w-full bg-[#1976D2] hover:bg-[#1565C0] text-white font-medium py-2.5 rounded-lg transition">OK</button>
  </div>
</div>
<script>
function toggleSidebar() {
  var s = document.getElementById('sidebar'), o = document.getElementById('overlay');
  var open = s.classList.contains('flex') && s.classList.contains('max-md-open');
  if (open) { s.classList.remove('flex', 'max-md-open'); s.classList.add('hidden'); o.classList.add('hidden'); }
  else { s.classList.remove('hidden'); s.classList.add('flex', 'max-md-open'); o.classList.remove('hidden'); }
}

function showModal(title, text, redirect) {
  var m = document.getElementById('modal');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  m.classList.remove('hidden'); m.classList.add('flex');
  document.getElementById('modal-ok').onclick = function () {
    if (redirect) { window.location.href = redirect; }
    else { m.classList.add('hidden'); m.classList.remove('flex'); }
  };
}

document.getElementById('form-ag').addEventListener('submit', function (e) {
  e.preventDefault();
  showModal('Agendamento salvo', 'Agendamento registrado com sucesso! O lembrete será enviado automaticamente.', './agenda.html');
});
</script>
