<h1 class="text-2xl font-bold text-gray-800 mb-6">Configurações</h1>
<div class="space-y-6 max-w-3xl">
  <section class="bg-white rounded-xl shadow-sm p-6">
    <div class="flex items-center justify-between gap-4">
      <div>
        <h2 class="text-base font-semibold text-gray-800">Lembretes Automáticos</h2>
        <p class="text-sm text-gray-500 mt-1">Enviar 24h antes do atendimento</p>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input id="toggle" type="checkbox" class="sr-only peer" checked>
        <div class="w-11 h-6 bg-gray-300 rounded-full peer-checked:bg-[#1976D2] transition after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:bg-white after:rounded-full after:shadow after:transition peer-checked:after:translate-x-5"></div>
      </label>
    </div>
    <p id="toggle-status" class="text-xs text-[#4CAF50] font-medium mt-3">● Ativado – e-mail e WhatsApp</p>
  </section>
  <section class="bg-white rounded-xl shadow-sm p-6">
    <h2 class="text-base font-semibold text-gray-800 mb-4">Dados da Clínica</h2>

      <div><label class="label" for="ccidade">Cidade</label><input id="ccidade" class="input" value="Cariacica/ES"></div>
      <div><label class="label" for="ctel">Telefone</label><input id="ctel" type="tel" class="input" value="(27) 3333-4444"></div>
    </div>
  </section>
  <div class="flex justify-end">
    <button id="salvar" class="px-6 py-2.5 rounded-lg bg-[#1976D2] hover:bg-[#1565C0] text-white font-semibold transition">Salvar</button>
  </div>
  <p class="text-xs text-gray-400 text-center">PhysioPosses Agenda – Protótipo v1.0 · Projeto acadêmico</p>
</div>

</main>
<script>
function toggleSidebar() {
  var s = document.getElementById('sidebar'), o = document.getElementById('overlay');
  var open = s.classList.contains('flex') && s.classList.contains('max-md-open');
  if (open) { s.classList.remove('flex', 'max-md-open'); s.classList.add('hidden'); o.classList.add('hidden'); }
  else { s.classList.remove('hidden'); s.classList.add('flex', 'max-md-open'); o.classList.remove('hidden'); }
}

document.getElementById('toggle').addEventListener('change', function () {
  var s = document.getElementById('toggle-status');
  s.textContent = this.checked ? '● Ativado – e-mail e WhatsApp' : '● Desativado';
  s.className = 'text-xs font-medium mt-3 ' + (this.checked ? 'text-[#4CAF50]' : 'text-gray-400');
});
document.getElementById('salvar').addEventListener('click', function () { alert('Configurações salvas!'); });
</script>
